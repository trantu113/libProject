<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 420px;">
    <h2 class="mb-3">Đăng ký</h2>

    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        {% if form.errors %}
            <div class="alert alert-danger">
                {% for field in form %}{% for error in field.errors %}<div>{{ error }}</div>{% endfor %}{% endfor %}
            </div>
        {% endif %}
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input name="username" class="form-control" value="{{ form.username.value|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input name="password1" type="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nhập lại mật khẩu</label>
            <input name="password2" type="password" class="form-control" required>
        </div>
        <button class="btn btn-success">Tạo tài khoản</button>
    </form>

    <p class="mt-3">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
</div>
</body>
</html>
