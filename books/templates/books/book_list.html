<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thư Viện</title>
    <!-- Nhúng trực tiếp Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-book-half"></i> Thư Viện </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="#">Tủ sách</a>
            <a class="nav-link" href="#">Sách đang mượn</a>
            <a class="btn btn-outline-light btn-sm ms-2" href="#">Đăng nhập</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh Mục Sách</h2>
        <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm Sách Mới</button>
    </div>

    <!-- Bảng danh sách sách -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Tên Sách</th>
                    <th>Tác Giả</th>
                    <th>Thể Loại</th>
                    <th>Số Lượng</th>
                    <th>Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Rừng Na Uy</td>
                    <td>Haruki Murakami</td>
                    <td>Văn học</td>
                    <td><span class="badge bg-success">Còn 3 cuốn</span></td>
                    <td>
                        <button class="btn btn-sm btn-info text-white">Mượn sách</button>
                        <button class="btn btn-sm btn-warning">Sửa</button>
                        <button class="btn btn-sm btn-danger">Xóa</button>
                    </td>
                </tr>

                <tr>
                    <td>Trại Súc Vật</td>
                    <td>George Orwell</td>
                    <td>Văn học</td>
                    <td><span class="badge bg-success">Còn 1 cuốn</span></td>
                    <td>
                        <button class="btn btn-sm btn-info text-white">Mượn sách</button>
                        <button class="btn btn-sm btn-warning">Sửa</button>
                        <button class="btn btn-sm btn-danger">Xóa</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
