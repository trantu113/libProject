<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% if book %}Sửa sách{% else %}Thêm sách{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 600px;">
    <h2>{% if book %}Sửa sách{% else %}Thêm sách mới{% endif %}</h2>

    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Tên sách</label>
            <input name="title" class="form-control" value="{{ book.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tác giả</label>
            <input name="author" class="form-control" value="{{ book.author }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Thể loại</label>
            <input name="category" class="form-control" value="{{ book.category }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Số lượng</label>
            <input name="available" type="number" min="0" class="form-control"
                   value="{{ book.available|default:1 }}">
        </div>
        <button class="btn btn-primary">Lưu</button>
        <a href="{% url 'books' %}" class="btn btn-secondary mt-2">Hủy</a>
    </form>
</div>
</body>
</html>
